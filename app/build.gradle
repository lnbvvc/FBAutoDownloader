plugins {
    id 'com.android.application'
}

// 1. تصحيح تلقائي لملف المانيفست
def mf = file("src/main/AndroidManifest.xml")
if (mf.exists()) {
    def txt = mf.getText("UTF-8")
    if (txt.contains('package="com.example.fbdownloader"')) {
        mf.write(txt.replace('package="com.example.fbdownloader"', ''), "UTF-8")
    }
}

// 2. مسح الأيقونة القديمة وتوليد اللوغو 3D الحقيقي (sc.jpeg) تلقائياً
def drawDir = file("src/main/res/drawable")
drawDir.mkdirs()
new File(drawDir, "ic_launcher.xml").delete()
new File(drawDir, "ic_launcher.png").delete()

