plugins {
    id 'com.android.application'
}

def mf = file("src/main/AndroidManifest.xml")
if (mf.exists()) {
    def txt = mf.getText("UTF-8")
    if (txt.contains('package="com.example.fbdownloader"')) {
        mf.write(txt.replace('package="com.example.fbdownloader"', ''), "UTF-8")
    }
}

android {
    namespace 'com.example.fbdownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.fbdownloader"
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
}
